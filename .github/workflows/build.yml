name: Build kodyar APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - name: Unzip project
        run: unzip -o kodyar-project.zip
      - name: Build
        run: cd kodyar-project && bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kodyar-apk
          path: kodyar-project/android/app/build/outputs/apk/debug/app-debug.apk
